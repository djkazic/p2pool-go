\* Two nodes gossiping with BOTH pruning actions live: PruneOrphans, which
\* deletes every share off the main chain, and PruneOldShares. Asks whether
\* dropping a live fork breaks the anchor or lets two nodes holding the same
\* shares disagree on the tip.
SPECIFICATION Spec
CONSTANTS
    Nodes      = {n1, n2}
    MaxShares  = 5
    PruneKeep  = 3
    Diffs      = {1, 2}
    AllowPrune = TRUE
INVARIANT TypeOK
INVARIANT TipKnown
INVARIANT ConsistentAnchor
INVARIANT AgreeOnEqualKnowledge
