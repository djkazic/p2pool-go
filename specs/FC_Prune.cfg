\* Two nodes gossiping with PruneOldShares enabled. Pruning moves each
\* node's anchor, so CacheSound no longer applies; what must still hold is
\* that within a node every value shares one anchor, and that two nodes
\* holding the same shares agree on the tip.
SPECIFICATION Spec
CONSTANTS
    Nodes      = {n1, n2}
    MaxShares  = 5
    PruneKeep  = 3
    Diffs      = {1}
    AllowPrune = TRUE
INVARIANT TypeOK
INVARIANT TipKnown
INVARIANT ConsistentAnchor
INVARIANT AgreeOnEqualKnowledge
