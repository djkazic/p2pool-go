\* Single node, no pruning: does fork choice select the heaviest chain, and
\* is the work it records the true work? PruneKeep is deliberately far below
\* the chain length, which used to be the condition that broke this.
SPECIFICATION Spec
CONSTANTS
    Nodes      = {n1}
    MaxShares  = 5
    PruneKeep  = 3
    Diffs      = {1, 2}
    AllowPrune = FALSE
INVARIANT TypeOK
INVARIANT TipKnown
INVARIANT CacheSound
INVARIANT ConsistentAnchor
INVARIANT TipIsHeaviest
