\* Dust standardness across the whole reward domain, including degenerate
\* 1-satoshi rewards. FinderGetsFee is deliberately NOT asserted here: when
\* the finder's own payout is below the dust limit the standardness pass
\* folds it into a larger output to keep the coinbase relayable, so the
\* finder can come away with nothing at rewards near the dust limit. At any
\* realistic subsidy the fee dwarfs dust -- see PPLNS_MainnetDust.cfg.
SPECIFICATION Spec
CONSTANTS
    NumMiners = 3
    Weights   = {0, 1, 2, 5}
    Rewards   = {1, 7, 100, 547, 1093, 5000, 100000}
    FeeNum    = 1
    FeeDen    = 200
    Dust      = 546
INVARIANT NoDustOutputs
INVARIANT PayoutConservation
INVARIANT NoNonPositive
