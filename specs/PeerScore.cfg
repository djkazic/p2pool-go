\* MaxFuture is scaled to 8 units (stands for MaxTimeFuture = 2h, so one
\* unit is 15 minutes). SkewSet ranges over honest clock offsets from
\* perfectly synced to 2 units (30 minutes) ahead.
SPECIFICATION Spec
CONSTANTS
    MaxFuture = 8
    SkewSet   = {0, 1, 2}
    MinBad    = 5
    RatioNum  = 1
    RatioDen  = 5
    MaxEvents = 8
    TimestampProvable = FALSE
INVARIANT TypeOK
INVARIANT NoProvableChargeAgainstHonestPeer
INVARIANT NoHonestDisconnect

\* The model stops after MaxEvents relays; running out of events is the
\* bound, not a deadlock.
CHECK_DEADLOCK FALSE
