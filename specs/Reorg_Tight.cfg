\* A one-slot channel and more tip movement, so the EventNewTip that follows
\* a reorg is routinely dropped and lastReorgTip is left armed with nothing
\* to swallow. Refresh timer off, so only the pipeline can recover.
SPECIFICATION Spec
CONSTANTS
    Tips           = {t1, t2, t3}
    QueueCap       = 1
    MaxChanges     = 4
    NoTip          = NoTip
    DedupeEnabled  = FALSE
    RefreshEnabled = FALSE
INVARIANT TypeOK
PROPERTY Converges
CHECK_DEADLOCK FALSE
